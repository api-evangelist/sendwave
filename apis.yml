name: SendWave
description: >-
  Sendwave is an international money-transfer service operated by Zepz (the
  fintech group behind WorldRemit) that lets people send money abroad directly
  from a mobile app, with a focus on low or no transfer fees and fast delivery
  to recipients across Africa, Asia and Latin America. Funds can be sent to
  mobile-money wallets, bank accounts and cash pickup in supported corridors.
  Sendwave is a consumer-facing app (iOS and Android) and is regulated as a
  money transmitter in the jurisdictions where it operates (NMLS No. 1179663).
  As of this profile it publishes no public developer API, SDKs, or developer
  portal; enrichment therefore captures its public identity, security posture,
  and support surface only.
